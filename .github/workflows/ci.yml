name: CI — Tests & Lint

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧹 Lint with Ruff
        run: |
          pip install ruff
          ruff check . --select E,F --ignore E501

      - name: 🧪 Run tests with pytest
        env:
          # Tests use mocks — real API keys not required
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'test-key' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || 'test-key' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'test-key' }}
          QDRANT_URL: ${{ secrets.QDRANT_URL || 'http://localhost:6333' }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY || 'test-key' }}
        run: |
          pytest tests/ -v --tb=short
